spring.application.name=eventbooking

server.port=8080

booking.lock-duration-seconds=300

booking.expiration-scan-ms=30000
booking.expiration-initial-delay-ms=30000

# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/event_booking_db
spring.datasource.username=root
spring.datasource.password=Abhi30@shek


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ===============================
# LOGGING
# ===============================

logging.level.root=INFO
logging.level.com.abhishek.eventbooking=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] [%thread] %logger{36} - %msg%n
logging.file.name=logs/event-booking.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ==========================================
# REDIS
# ==========================================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# ==========================================
# SPRING CACHE
# ==========================================

spring.cache.type=redis

spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true