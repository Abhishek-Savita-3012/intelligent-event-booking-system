# ===============================
# TEST DATABASE
# ===============================

spring.datasource.url=jdbc:h2:mem:event_booking_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# ===============================
# JWT TEST CONFIG
# ===============================

jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt.expiration=3600000


# ===============================
# BOOKING TEST CONFIG
# ===============================

booking.lock-duration-seconds=300
booking.expiration-scan-ms=3600000
booking.expiration-initial-delay-ms=3600000

# ===============================
# LOGGING
# ===============================

logging.level.root=WARN
logging.level.com.abhishek.eventbooking=WARN

# ==========================================
# CACHE
# ==========================================

spring.cache.type=none