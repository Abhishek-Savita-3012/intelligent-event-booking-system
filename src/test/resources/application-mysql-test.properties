# ===============================
# REAL MYSQL TEST PROFILE (JPA)
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true


# ===============================
# JWT
# ===============================

jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
jwt.expiration=3600000


# ===============================
# BOOKING
# ===============================

booking.lock-duration-seconds=300


# ===============================
# PREVENT SCHEDULER INTERFERENCE
# ===============================

booking.expiration-scan-ms=3600000
booking.expiration-initial-delay-ms=3600000


# ===============================
# LOGGING
# ===============================

logging.level.root=WARN
logging.level.com.abhishek.eventbooking=INFO

# ==========================================
# CACHE
# ==========================================

spring.cache.type=none